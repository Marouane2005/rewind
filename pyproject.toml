[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind"
version = "0.1.0"
description = "Phase 1 foundation for a transactional recovery and reconciliation proxy for MCP agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marouane El Aasri", email = "maroozi2018@gmail.com" }]
keywords = ["mcp", "json-rpc", "stdio", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0.1,<7",
    "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
rewind = "rewind.cli:main"

[project.urls]
Homepage = "https://github.com/Marouane2005/rewind"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rewind = ["py.typed", "journal/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
