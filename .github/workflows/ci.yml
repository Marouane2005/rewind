name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            arch: x86_64
            require_overmount: "1"
          - os: macos-15
            label: macos-arm64
            arch: arm64
            require_overmount: ""
          - os: macos-15-intel
            label: macos-x86_64
            arch: x86_64
            require_overmount: ""
    steps:
      - uses: actions/checkout@v4
      - name: Confirm architecture
        run: |
          echo "uname -m=$(uname -m)"
          test "$(uname -m)" = "${{ matrix.arch }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Allow unprivileged user namespaces
        if: matrix.label == 'linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        env:
          REWIND_EXPECT_MACHINE: ${{ matrix.arch }}
          REWIND_REQUIRE_LIVE_OVERMOUNT: ${{ matrix.require_overmount }}
        run: python -m pytest -rs
